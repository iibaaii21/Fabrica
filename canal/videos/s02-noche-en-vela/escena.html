<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const C = { coral: 0xff5d73, amber: 0xffc145, cyan: 0x3ee6ff, lime: 0xa6ff5c, violet: 0x8a6cff };
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const clamp01 = x => Math.max(0, Math.min(1, x));
const lerp = (a, b, t) => a + (b - a) * t;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x120c33, 0.018);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 400);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 0.72));
composer.addPass(new OutputPass());
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const finish = new ShaderPass({ uniforms: { tDiffuse: { value: null }, t: { value: 0 }, punch: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float t; uniform float punch; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + t*91.7) * 43758.5453); }
    void main(){ vec2 c = vUv-0.5; float ab = 0.0012 + punch*0.006;
      vec3 col = vec3(texture2D(tDiffuse, vUv + c*ab).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - c*ab).b);
      float v = smoothstep(0.85, 0.25, length(c*vec2(0.9,1.2))); col *= mix(0.62, 1.0, v);
      col = (col - 0.5) * 1.06 + 0.5; col += (h(vUv*vec2(1080.,1920.)) - 0.5) * 0.035;
      gl_FragColor = vec4(col, 1.0); }` });
composer.addPass(finish);

// background gradient sphere
const bgGeo = new THREE.SphereGeometry(250, 32, 16);
const bgMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { t: { value: 0 } },
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'varying vec3 p; uniform float t; void main(){ float h = p.y*0.5+0.5; vec3 a = vec3(0.05,0.04,0.16), b = vec3(0.16,0.06,0.26), c = vec3(0.02,0.10,0.20); vec3 col = mix(a,b,h); col = mix(col, c, 0.5+0.5*sin(p.x*3.0+t*0.2)); gl_FragColor = vec4(col*0.9,1.); }' });
scene.add(new THREE.Mesh(bgGeo, bgMat));

scene.add(new THREE.AmbientLight(0x8877ff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(10, 20, 15); scene.add(key);
const p1 = new THREE.PointLight(C.coral, 30, 60); scene.add(p1);
const p2 = new THREE.PointLight(C.cyan, 30, 60); scene.add(p2);

// floating shapes across the whole world
const floaters = [];
const fGeos = [new THREE.IcosahedronGeometry(1, 0), new THREE.TorusGeometry(0.8, 0.28, 16, 40), new THREE.OctahedronGeometry(1, 0), new THREE.TorusKnotGeometry(0.6, 0.2, 80, 12)];
const palette = [C.coral, C.amber, C.cyan, C.lime, C.violet];
for (let i = 0; i < 70; i++) {
  const m = new THREE.Mesh(fGeos[i % 4], new THREE.MeshPhysicalMaterial({ color: palette[i % 5], roughness: 0.18, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.15, emissive: palette[i % 5], emissiveIntensity: 0.1 }));
  const base = new THREE.Vector3(rnd() * 200 - 20, rnd() * 50 - 25, -10 - rnd() * 40);
  if (Math.abs(base.y) < 9 && base.z > -16) base.z -= 14;
  m.userData = { base, sp: 0.2 + rnd() * 0.5, ph: rnd() * 6.28, s: 0.5 + rnd() * 1.3 };
  m.scale.setScalar(m.userData.s); scene.add(m); floaters.push(m);
}
// particles
const pg = new THREE.BufferGeometry(); const pp = [];
for (let i = 0; i < 2500; i++) pp.push(rnd() * 220 - 30, rnd() * 80 - 40, rnd() * 70 - 60);
pg.setAttribute('position', new THREE.Float32BufferAttribute(pp, 3));
const particles = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xcfc6ff, size: 0.12, transparent: true, opacity: 0.8 }));
scene.add(particles);

// helpers: canvas text texture
function textTex(lines, opts = {}) {
  const w = opts.w || 1024, h = opts.h || 512, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  if (opts.bg) { x.fillStyle = opts.bg; x.beginPath(); x.roundRect(0, 0, w, h, opts.r ?? 48); x.fill(); }
  if (opts.lined) { x.strokeStyle = 'rgba(80,110,200,.35)'; x.lineWidth = 4; for (let y = 120; y < h; y += 70) { x.beginPath(); x.moveTo(40, y); x.lineTo(w - 40, y); x.stroke(); } x.strokeStyle = 'rgba(255,93,115,.6)'; x.beginPath(); x.moveTo(110, 0); x.lineTo(110, h); x.stroke(); }
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const lh = opts.lh || 1.1, fs = opts.fs || 120;
  lines.forEach((l, i) => { x.font = `${opts.weight || 900} ${fs}px "Inter Display", Inter, sans-serif`; x.fillStyle = opts.color || '#fff'; x.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * fs * lh); });
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function label(lines, scale, opts) { const m = new THREE.Mesh(new THREE.PlaneGeometry(scale * 2, scale), new THREE.MeshBasicMaterial({ map: textTex(lines, opts), transparent: true, depthWrite: false })); return m; }

// curve helper: progressive tube
function tube(points, color, r = 0.16) {
  const curve = new THREE.CatmullRomCurve3(points);
  const g = new THREE.TubeGeometry(curve, points.length * 6, r, 12, false);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.9, roughness: 0.3 }));
  m.userData.total = g.index.count; g.setDrawRange(0, 0); return m;
}

// ---------- stations (s02: dormir y memoria) ----------
const ST = { A: new THREE.Vector3(0, 0, 0), B: new THREE.Vector3(40, 0, 0), C: new THREE.Vector3(80, 0, 0), D: new THREE.Vector3(120, 0, 0), E: new THREE.Vector3(160, 0, 0) };
const glowMat = (c, e = 0.9) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: e, roughness: 0.3, metalness: 0.2 });

// A: reloj de madrugada con las agujas corriendo
const clock = new THREE.Group(); clock.position.set(ST.A.x, -1.2, 0); scene.add(clock);
const rim = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.32, 24, 80), glowMat(C.cyan, 0.8)); clock.add(rim);
const face = new THREE.Mesh(new THREE.CircleGeometry(3.15, 64), new THREE.MeshPhysicalMaterial({ color: 0x1b1450, roughness: 0.2, clearcoat: 1, metalness: 0.1 })); face.position.z = -0.1; clock.add(face);
for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; const tick = new THREE.Mesh(new THREE.BoxGeometry(0.14, i % 3 ? 0.35 : 0.7, 0.1), glowMat(i % 3 ? 0xcfc6ff : C.amber, 0.7)); tick.position.set(Math.sin(a) * 2.7, Math.cos(a) * 2.7, 0); tick.rotation.z = -a; clock.add(tick); }
const hHand = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.7, 0.1), glowMat(0xffffff, 1.2)); hHand.geometry.translate(0, 0.85, 0.05); clock.add(hHand);
const mHand = new THREE.Mesh(new THREE.BoxGeometry(0.14, 2.5, 0.1), glowMat(C.coral, 1.4)); mHand.geometry.translate(0, 1.25, 0.1); clock.add(mHand);
const bells = [-1, 1].map(sg => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), glowMat(C.amber, 0.5)); b.position.set(sg * 2.3, 3.2, 0); b.rotation.z = -sg * 0.6; clock.add(b); return b; });
const timeLbl = label(['3:47'], 2.0, { fs: 230, color: '#ff5d73' }); timeLbl.position.set(ST.A.x, 3.9, 0.6); scene.add(timeLbl);

// B: luna + cerebro de nodos que se van guardando
const moon = new THREE.Mesh(new THREE.SphereGeometry(2.1, 48, 32), new THREE.MeshStandardMaterial({ color: 0xfff1c4, emissive: 0xffd36b, emissiveIntensity: 0.55, roughness: 0.7 }));
moon.position.set(ST.B.x + 2.8, 5.3, -1.5); scene.add(moon);
const brain = new THREE.Group(); brain.position.set(ST.B.x - 0.4, -2.2, 0.5); scene.add(brain);
const bPts = [];
for (let i = 0; i < 70; i++) { // nube con forma de cerebro (dos lóbulos)
  const lob = i % 2 ? 1 : -1; const u = rnd() * Math.PI * 2, v = Math.acos(2 * rnd() - 1);
  const p = new THREE.Vector3(Math.sin(v) * Math.cos(u) * 2.1 + lob * 1.25, Math.cos(v) * 1.7, Math.sin(v) * Math.sin(u) * 1.6);
  bPts.push(p); const n = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), glowMat(C.violet, 0.3)); n.position.copy(p); n.userData.k = i / 70; brain.add(n);
}
const bl = []; for (let i = 0; i < bPts.length; i++) for (let j = i + 1; j < bPts.length; j++) if (bPts[i].distanceTo(bPts[j]) < 1.15) bl.push(...bPts[i].toArray(), ...bPts[j].toArray());
const bGeo = new THREE.BufferGeometry(); bGeo.setAttribute('position', new THREE.Float32BufferAttribute(bl, 3));
const bLines = new THREE.LineSegments(bGeo, new THREE.LineBasicMaterial({ color: C.violet, transparent: true, opacity: 0.25 })); brain.add(bLines);
const saveBarBg = new THREE.Mesh(new THREE.BoxGeometry(7, 0.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x2a2266, roughness: 0.5 })); saveBarBg.position.set(ST.B.x, 1.1, 0.4); scene.add(saveBarBg);
const saveBar = new THREE.Mesh(new THREE.BoxGeometry(7, 0.5, 0.25), glowMat(C.lime, 1.2)); saveBar.geometry.translate(3.5, 0, 0); saveBar.position.set(ST.B.x - 3.5, 1.1, 0.45); scene.add(saveBar);
const saveLbl = label(['GUARDANDO…'], 1.5, { fs: 150, color: '#a6ff5c' }); saveLbl.position.set(ST.B.x, 2.2, 0.5); scene.add(saveLbl);

// C: 1924, dormir frente a estar despierto (comparación cualitativa)
const yr1 = label(['1924'], 3.0, { fs: 300, color: '#ffc145' }); yr1.position.set(ST.C.x, 5.0, -0.5); scene.add(yr1);
const who1 = label(['Jenkins y Dallenbach'], 2.4, { fs: 92, weight: 700, color: '#e9e4ff' }); who1.position.set(ST.C.x, 2.8, -0.5); scene.add(who1);
const barSleep = new THREE.Mesh(new THREE.BoxGeometry(2.2, 6, 2.2), glowMat(C.cyan, 0.7)); barSleep.geometry.translate(0, 3, 0); barSleep.position.set(ST.C.x - 2.1, -6.2, 0); scene.add(barSleep);
const barWake = new THREE.Mesh(new THREE.BoxGeometry(2.2, 6, 2.2), glowMat(C.coral, 0.7)); barWake.geometry.translate(0, 3, 0); barWake.position.set(ST.C.x + 2.1, -6.2, 0); scene.add(barWake);
const lSleep = label(['DURMIENDO'], 1.3, { fs: 140, color: '#3ee6ff' }); lSleep.position.set(ST.C.x - 2.1, -7.2, 1.3); scene.add(lSleep);
const lWake = label(['DESPIERTO'], 1.3, { fs: 140, color: '#ff5d73' }); lWake.position.set(ST.C.x + 2.1, -7.2, 1.3); scene.add(lWake);
const zzz = ['Z', 'z', 'z'].map((z, i) => { const l = label([z], 0.9 + i * 0.15, { fs: 300, color: '#cfe9ff' }); scene.add(l); return l; });
const lMore = label(['recuerdas más'], 1.4, { fs: 120, weight: 800, color: '#ffffff' }); lMore.position.set(ST.C.x - 2.1, 1.2, 1.4); scene.add(lMore);

// D: 2007, hasta −40 %
const yr2 = label(['2007 · Harvard'], 3.2, { fs: 150, color: '#ffc145', w: 1400, h: 700 }); yr2.position.set(ST.D.x, 5.2, -0.5); scene.add(yr2);
const big = label(['−40 %'], 3.6, { fs: 320, color: '#ff5d73' }); big.position.set(ST.D.x, 1.5, 0.6); scene.add(big);
const upTo = label(['hasta'], 1.6, { fs: 300, weight: 800, color: '#ffffff' }); upTo.position.set(ST.D.x - 2.9, 3.5, 0.8); scene.add(upTo);
const memBlocks = []; for (let i = 0; i < 10; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), glowMat(i < 6 ? C.lime : C.coral, 0.6)); m.position.set(ST.D.x - 4.05 + i * 0.9, -1.9, 0); m.userData.i = i; scene.add(m); memBlocks.push(m); }
const lMem = label(['lo que recuerdas sin dormir'], 3.0, { fs: 128, weight: 700, color: '#e9e4ff', w: 1600, h: 800 }); lMem.position.set(ST.D.x, -3.3, 0.4); scene.add(lMem);

// E: el truco (tres pasos) + almohada
const steps = [['1 · ESTUDIA DE DÍA', '#ffc145'], ['2 · REPASA ANTES DE DORMIR', '#3ee6ff'], ['3 · DUERME', '#a6ff5c']].map(([t, c], i) => {
  const l = label([t], 2.2, { fs: 92, color: '#0d0b2a', bg: c, r: 120, w: 1600, h: 800 }); l.position.set(ST.E.x, 3.4 - i * 2.4, 0.4); scene.add(l); return l; });
const pillowShape = new THREE.SphereGeometry(1, 48, 24); pillowShape.scale(3.0, 0.9, 1.9);
const pillow = new THREE.Mesh(pillowShape, new THREE.MeshPhysicalMaterial({ color: 0xe9e4ff, roughness: 0.6, clearcoat: 0.3, emissive: 0x8a6cff, emissiveIntensity: 0.12 })); pillow.position.set(ST.E.x, -5.0, 0); scene.add(pillow);

scene.traverse(o => { if (o.isMesh && o.material && !o.material.isMeshPhysicalMaterial && o.material.isMeshStandardMaterial) o.material.envMapIntensity = 0.12; });
// ---------- timeline ----------
let T = null;
window.setup = (timing) => { T = timing; };
const segOf = t => T.segs.findIndex(s => t >= s.ini - 0.0 && t < (s.fin + 0.33));
function stationAt(t) {
  // camera target follows the scene letter of the current/next segment
  const s = T.segs; let cur = s[0];
  for (const x of s) if (t >= x.ini - 0.6) cur = x;
  return cur.esc;
}
const camPose = { A: [0, 0.3, 15], B: [40, -0.3, 19], C: [80, -1.0, 20], D: [120, -0.4, 19.5], E: [160, -0.6, 17] };
let camPrev = null;
function firstIni(letter) { return T.segs.find(s => s.esc === letter).ini; }

function setCaption(t) {
  const cap = document.getElementById('cap'), hook = document.getElementById('hook'), badge = document.getElementById('badge');
  const i = T.segs.findIndex(s => t >= s.ini && t <= s.fin + 0.3);
  hook.hidden = !(t < T.segs[0].fin + 0.3);
  if (!hook.hidden) hook.innerHTML = '¿VAS A PASAR LA NOCHE EN VELA <em>ANTES DEL EXAMEN?</em>'; hook.style.transform = `scale(${1 + 0.18 * Math.max(0, 1 - t / 0.35)})`; hook.style.opacity = Math.min(1, t / 0.12);
  const c = T.segs[2] ? null : null;
  const bt = t >= firstIni('C') - 0.2 && t < firstIni('E') - 0.2 ? 'LO DICE LA CIENCIA' : t >= firstIni('E') - 0.2 ? 'EL TRUCO' : '';
  badge.hidden = !bt; badge.textContent = bt;
  if (i < 0 || i === 0) { cap.innerHTML = ''; return; }
  const s = T.segs[i]; const words = s.texto.split(/\s+/);
  const total = words.reduce((a, w) => a + w.length + 1, 0); let acc = 0; let wi = 0;
  const p = clamp01((t - s.ini) / (s.fin - s.ini)) * total;
  for (let k = 0; k < words.length; k++) { acc += words[k].length + 1; if (p < acc) { wi = k; break; } wi = k; }
  const g0 = Math.floor(wi / 3) * 3; const grp = words.slice(g0, g0 + 3);
  let wStart = s.ini; { let acc2 = 0; for (let k = 0; k < wi; k++) acc2 += words[k].length + 1; wStart = s.ini + (acc2 / total) * (s.fin - s.ini); }
  const wp = Math.max(0, Math.min(1, (t - wStart) / 0.12));
  cap.innerHTML = grp.map((w, k) => `<span class="${g0 + k === wi ? 'on' : ''}" style="display:inline-block;${g0 + k === wi ? `transform:scale(${1 + 0.14 * (1 - wp)}) translateY(${-8 * (1 - wp)}px)` : ''}">${w.replace(/[<>&]/g, '')}</span>`).join(' ');
  const pop = clamp01(((t - s.ini) * 30) % 30 / 4);
  cap.style.transform = `scale(${1 + 0.06 * (1 - ease(pop))})`;
}

window.renderAt = (t) => {
  bgMat.uniforms.t.value = t;
  document.getElementById('bar').style.width = (100 * t / T.dur) + '%';
  // floaters & particles
  for (const m of floaters) { const u = m.userData; m.position.set(u.base.x + Math.sin(t * u.sp + u.ph) * 1.2, u.base.y + Math.cos(t * u.sp * 0.8 + u.ph) * 1.4, u.base.z); m.rotation.set(t * u.sp, t * u.sp * 0.7, 0); }
  particles.rotation.y = Math.sin(t * 0.05) * 0.02; particles.position.y = Math.sin(t * 0.3) * 0.4;
  // camera
  const letters = ['A', 'B', 'C', 'D', 'E']; let a = 'A', b = 'A', k = 0;
  for (let i = 1; i < letters.length; i++) { const st = firstIni(letters[i]) - 0.9; if (t >= st) { a = letters[i - 1]; b = letters[i]; k = ease((t - st) / 1.1); } }
  const pa = camPose[a], pb = camPose[b];
  const cx = lerp(pa[0], pb[0], k), cy = lerp(pa[1], pb[1], k), cz = lerp(pa[2], pb[2], k) + Math.sin(k * Math.PI) * 5;
  camera.position.set(cx + Math.sin(t * 0.45) * 1.3, cy + Math.cos(t * 0.37) * 0.8, cz - Math.sin(t * 0.2) * 0.8);
  camera.lookAt(cx + Math.sin(t * 0.3) * 0.3, cy * 0.4, 0);
  { let pk = 0; for (const L of ['B','C','D','E']) { const st = firstIni(L) - 0.9; const q = (t - st) / 1.1; if (q > 0 && q < 1) pk = Math.max(pk, Math.sin(q * Math.PI)); }
    camera.rotation.z += pk * 0.06 * Math.sin(t * 3); camera.fov = 50 + pk * 9 - Math.max(0, 1 - t / 0.5) * 6; camera.updateProjectionMatrix(); finish.uniforms.punch.value = pk; finish.uniforms.t.value = t; }
  p1.position.set(cx - 6, cy + 6, 6); p2.position.set(cx + 6, cy - 5, 5);
  const sg = T.segs;
  // A: agujas que corren
  const ta = sg[0].ini; const spin = (t - ta) * 2.4 + Math.max(0, t - sg[1].ini) * 4;
  mHand.rotation.z = -spin * 2.0; hHand.rotation.z = -spin * 0.17 - 0.6;
  clock.rotation.y = Math.sin(t * 0.7) * 0.25; clock.rotation.z = Math.sin(t * 22) * 0.02 * clamp01((t - sg[1].ini) / 0.3);
  bells.forEach((b, i) => { b.position.y = 3.2 + Math.abs(Math.sin(t * 18 + i)) * 0.15 * clamp01((t - sg[1].ini) / 0.3); });
  timeLbl.scale.setScalar(Math.max(0.001, ease((t - sg[0].fin - 0.3) / 0.5))); timeLbl.rotation.y = Math.sin(t * 0.9) * 0.2;
  // B: el cerebro guarda
  const s2 = sg[2]; const sv = clamp01((t - s2.ini) / (s2.fin - s2.ini));
  moon.rotation.y = t * 0.2; moon.position.y = 5.3 + Math.sin(t * 0.8) * 0.2;
  brain.rotation.y = Math.sin(t * 0.5) * 0.5 + t * 0.15;
  brain.children.forEach((n, i) => { if (n.isMesh) { const on = sv > n.userData.k ? 1 : 0; n.material.emissiveIntensity = 0.3 + on * (2 + Math.sin(t * 5 + i) * 0.5); n.material.color.setHex(on ? C.lime : C.violet); n.material.emissive.setHex(on ? C.lime : C.violet); } });
  bLines.material.opacity = 0.2 + 0.5 * sv; bLines.material.color.setHex(sv > 0.5 ? C.lime : C.violet);
  saveBar.scale.x = Math.max(0.001, ease(sv)); saveLbl.scale.setScalar(ease((t - s2.ini) / 0.4)); saveLbl.material.opacity = 0.6 + 0.4 * Math.sin(t * 6);
  // C: 1924
  const tc = firstIni('C'); yr1.scale.setScalar(ease((t - tc) / 0.6)); who1.scale.setScalar(ease((t - tc - 0.6) / 0.6)); yr1.rotation.y = Math.sin(t * 0.8) * 0.15;
  const s4 = sg[4]; const gb = ease((t - s4.ini) / Math.max(0.5, (s4.fin - s4.ini) * 0.7));
  barSleep.scale.y = Math.max(0.001, gb * 1.0); barWake.scale.y = Math.max(0.001, gb * 0.55);
  lSleep.scale.setScalar(ease((t - s4.ini) / 0.5)); lWake.scale.setScalar(ease((t - s4.ini - 0.2) / 0.5));
  lMore.scale.setScalar(ease((gb - 0.8) / 0.2)); lMore.position.y = -6.2 + 6 * gb + 1.0;
  zzz.forEach((z, i) => { const q = ((t * 0.5 + i / 3) % 1); z.position.set(ST.C.x - 3.6 + q * 1.4, -1.5 + q * 4.5, 1.5); z.material.opacity = Math.sin(q * Math.PI) * clamp01((t - s4.ini) / 0.5); });
  // D: 2007 −40 %
  const s5 = sg[5]; const dp = clamp01((t - s5.ini) / (s5.fin - s5.ini));
  yr2.scale.setScalar(ease(dp / 0.15)); upTo.scale.setScalar(ease((dp - 0.46) / 0.1)); big.scale.setScalar(ease((dp - 0.5) / 0.12) * (1 + 0.05 * Math.sin(t * 6)));
  lMem.scale.setScalar(ease((dp - 0.2) / 0.15));
  memBlocks.forEach(m => { const i = m.userData.i; const app = ease((dp - 0.2 - i * 0.02) / 0.1); const fall = i >= 6 ? ease((dp - 0.42 - (i - 6) * 0.04) / 0.16) : 0;
    m.scale.setScalar(Math.max(0.001, app * (1 - fall))); m.position.y = -1.9 - fall * 3; m.rotation.set(t * 0.8 + i, t * 0.6, fall * 3); });
  // E: pasos + almohada
  const te = firstIni('E');
  steps.forEach((l, i) => { const at = i < 2 ? sg[6].ini + i * (sg[6].fin - sg[6].ini) * 0.45 : sg[7].ini; const q = ease((t - at) / 0.5); l.scale.setScalar(Math.max(0.001, q)); l.position.x = ST.E.x + (1 - q) * 6; l.rotation.y = Math.sin(t * 0.8 + i) * 0.08; });
  pillow.scale.setScalar(Math.max(0.001, ease((t - te + 0.3) / 0.7))); pillow.rotation.y = Math.sin(t * 0.6) * 0.3; pillow.position.y = -5.0 + Math.sin(t * 1.4) * 0.15;
  setCaption(t);
  composer.render();
};
