<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lumen Drift</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';
  const W = 1280, H = 720;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let scale = 1, offX = 0, offY = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
    scale = Math.min(w / W, h / H);
    offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
  }
  window.addEventListener('resize', resize); resize();

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('lumen_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('lumen_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let best = store.get('best', 0);
  let muted = store.get('muted', false);

  // ---------- audio ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    spark(c) { tone(660 * Math.pow(1.06, Math.min(c, 12)), 0.12, 'triangle', 0.1); },
    crash() { tone(220, 0.5, 'sawtooth', 0.15, 0.2); tone(90, 0.6, 'square', 0.08, 0.5); },
    start() { tone(440, 0.1, 'triangle', 0.08); setTimeout(() => tone(880, 0.15, 'triangle', 0.08), 90); },
    shield() { tone(520, 0.3, 'sine', 0.12, 2); }
  };

  // ---------- input ----------
  let holding = false;
  function press(e) {
    if (e && e.cancelable) e.preventDefault();
    audio();
    const p = pointerPos(e);
    if (p && hitMute(p)) { muted = !muted; store.set('muted', muted); return; }
    holding = true;
    if (state === 'title' || (state === 'over' && overTimer > 0.6)) startGame();
    else if (state === 'paused') state = 'play';
  }
  function release(e) { if (e && e.cancelable) e.preventDefault(); holding = false; }
  function pointerPos(e) {
    if (!e) return null;
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    if (t.clientX === undefined) return null;
    return { x: (t.clientX - offX) / scale, y: (t.clientY - offY) / scale };
  }
  function hitMute(p) { return p.x > W - 80 && p.y < 80; }
  cv.addEventListener('mousedown', press); window.addEventListener('mouseup', release);
  cv.addEventListener('touchstart', press, { passive: false }); window.addEventListener('touchend', release, { passive: false });
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { if (!e.repeat) press(e); } if (e.code === 'KeyP' && state === 'play') state = 'paused'; });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(e); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { state = 'paused'; holding = false; } });

  // ---------- world ----------
  let state = 'title', overTimer = 0;
  let player, cave, sparks, pillars, parts, stars, speed, dist, score, combo, comboT, shake, shield, flash, hue, newBest;
  const SEG = 40;

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function initStars() {
    stars = [];
    for (let i = 0; i < 90; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.15, 1) });
  }
  initStars(); parts = []; sparks = []; pillars = []; hue = 190; shake = 0; flash = 0;

  function gapFor(d) { return Math.max(230, 420 - d * 0.006); }

  function newCave() {
    cave = []; let mid = H / 2;
    for (let i = 0; i <= W / SEG + 2; i++) cave.push({ x: i * SEG, mid, gap: 420 });
  }
  function extendCave() {
    const last = cave[cave.length - 1];
    const drift = Math.min(70, 26 + dist * 0.0015);
    let mid = last.mid + rnd(-drift, drift);
    const gap = gapFor(dist);
    mid = Math.max(gap / 2 + 30, Math.min(H - gap / 2 - 30, mid));
    cave.push({ x: last.x + SEG, mid, gap });
    // place things
    if (Math.random() < 0.28) sparks.push({ x: last.x + SEG, y: mid + rnd(-gap * 0.3, gap * 0.3), t: rnd(0, 6), gold: Math.random() < 0.06 });
    if (dist > 2500 && Math.random() < Math.min(0.09, 0.03 + dist * 0.000004)) {
      const up = Math.random() < 0.5, len = gap * rnd(0.32, 0.5);
      pillars.push({ x: last.x + SEG, up, len, mid, gap, w: 26 });
    }
  }
  function caveAt(x) {
    for (let i = 0; i < cave.length - 1; i++) {
      const a = cave[i], b = cave[i + 1];
      if (x >= a.x && x <= b.x) { const t = (x - a.x) / (b.x - a.x); return { mid: a.mid + (b.mid - a.mid) * t, gap: a.gap + (b.gap - a.gap) * t }; }
    }
    return { mid: H / 2, gap: 400 };
  }

  function startGame() {
    player = { x: 300, y: H / 2, vy: 0, trail: [] };
    sparks = []; pillars = []; parts = [];
    speed = 330; dist = 0; score = 0; combo = 0; comboT = 0; shake = 0; shield = 0; flash = 0; hue = 190; newBest = false;
    newCave();
    state = 'play'; sfx.start();
  }

  function burst(x, y, n, col, sp) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), v = rnd(40, sp || 260);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.4, 0.9), max: 0.9, col });
    }
  }

  function die() {
    if (shield > 0) { shield = 0; flash = 0.4; shake = 10; sfx.shield(); burst(player.x, player.y, 30, '#9ff', 300); player.vy = -player.vy * 0.5; return false; }
    state = 'over'; overTimer = 0; shake = 22; sfx.crash();
    burst(player.x, player.y, 70, '#ffd27a', 420);
    if (score > best) { best = score; newBest = true; store.set('best', best); }
    return true;
  }

  // ---------- update ----------
  function update(dt) {
    for (const s of stars) { s.x -= (state === 'play' ? speed : 60) * s.z * 0.15 * dt; if (s.x < 0) { s.x = W; s.y = rnd(0, H); } }
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
    shake *= 0.88; flash = Math.max(0, flash - dt);
    if (state === 'over') { overTimer += dt; return; }
    if (state !== 'play') return;

    speed = Math.min(720, 330 + dist * 0.012);
    const dx = speed * dt; dist += dx;
    hue = (190 + dist * 0.01) % 360;
    for (const c of cave) c.x -= dx;
    for (const s of sparks) s.x -= dx;
    for (const p of pillars) p.x -= dx;
    while (cave.length && cave[1] && cave[1].x < -SEG) cave.shift();
    while (cave[cave.length - 1].x < W + SEG * 2) extendCave();
    sparks = sparks.filter(s => s.x > -40);
    pillars = pillars.filter(p => p.x > -60);

    // physics: hold to rise
    const g = 1500, lift = -2900;
    player.vy += (holding ? lift : 0) * dt + g * dt;
    player.vy = Math.max(-560, Math.min(620, player.vy));
    player.y += player.vy * dt;
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 26) player.trail.shift();
    for (const t of player.trail) t.x -= dx;

    score = Math.floor(dist / 10) + bonus;
    comboT -= dt; if (comboT <= 0) combo = 0;
    if (shield > 0) shield -= dt;

    // collide walls
    const c = caveAt(player.x), r = 13;
    if (player.y - r < c.mid - c.gap / 2 || player.y + r > c.mid + c.gap / 2) {
      if (!die()) player.y = Math.max(c.mid - c.gap / 2 + r + 2, Math.min(c.mid + c.gap / 2 - r - 2, player.y));
      else return;
    }
    for (const p of pillars) {
      if (Math.abs(p.x - player.x) < p.w / 2 + r) {
        const top = p.mid - p.gap / 2, bot = p.mid + p.gap / 2;
        const hit = p.up ? player.y + r > bot - p.len : player.y - r < top + p.len;
        if (hit && !p.dead) { p.dead = true; if (die()) return; }
      }
    }
    for (const s of sparks) {
      if (!s.got && Math.hypot(s.x - player.x, s.y - player.y) < 28) {
        s.got = true; combo++; comboT = 1.6;
        const gain = (s.gold ? 100 : 10) * Math.min(combo, 10);
        bonus += gain; pops.push({ x: s.x, y: s.y, t: 0.8, txt: '+' + gain });
        if (s.gold) { shield = 6; sfx.shield(); burst(s.x, s.y, 26, '#fff3b0', 300); }
        else { sfx.spark(combo); burst(s.x, s.y, 10, `hsl(${hue},100%,75%)`, 180); }
      }
    }
    sparks = sparks.filter(s => !s.got);
    for (let i = pops.length - 1; i >= 0; i--) { pops[i].t -= dt; pops[i].y -= 40 * dt; if (pops[i].t <= 0) pops.splice(i, 1); }
  }
  let bonus = 0, pops = [];
  const _start = startGame;
  startGame = function () { bonus = 0; pops = []; _start(); };

  // ---------- render ----------
  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05060d'; ctx.fillRect(0, 0, cv.width, cv.height);
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, (offX + sx * scale) * dpr, (offY + sy * scale) * dpr);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, `hsl(${hue + 40},45%,9%)`); bg.addColorStop(1, `hsl(${hue},55%,5%)`);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (const s of stars) { ctx.globalAlpha = s.z * 0.8; ctx.fillStyle = '#cfe8ff'; ctx.fillRect(s.x, s.y, 2 * s.z + 0.5, 2 * s.z + 0.5); }
    ctx.globalAlpha = 1;

    if (cave && state !== 'title') drawCave(); else drawTitleCave(t);

    if (state !== 'title') {
      for (const s of sparks) {
        const pulse = 1 + Math.sin(t * 6 + s.t) * 0.2, rr = (s.gold ? 13 : 8) * pulse;
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(t * 2 + s.t);
        ctx.shadowBlur = 24; ctx.shadowColor = s.gold ? '#ffe9a0' : `hsl(${hue},100%,70%)`;
        ctx.fillStyle = s.gold ? '#ffe9a0' : `hsl(${hue},100%,80%)`;
        ctx.beginPath(); for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); ctx.lineTo(Math.cos(a + Math.PI / 4) * rr * 0.35, Math.sin(a + Math.PI / 4) * rr * 0.35); }
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      if (state !== 'over') drawPlayer(t);
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.font = '700 22px system-ui, sans-serif'; ctx.textAlign = 'center';
    for (const p of pops) { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = '#fff'; ctx.fillText(p.txt, p.x, p.y); }
    ctx.globalAlpha = 1;
    if (flash > 0) { ctx.fillStyle = `rgba(160,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }

    drawUI(t);
    ctx.restore();
  }

  function wallPath(top) {
    ctx.beginPath();
    ctx.moveTo(cave[0].x, top ? -10 : H + 10);
    for (const c of cave) ctx.lineTo(c.x, top ? c.mid - c.gap / 2 : c.mid + c.gap / 2);
    ctx.lineTo(cave[cave.length - 1].x, top ? -10 : H + 10); ctx.closePath();
  }
  function drawCave() {
    for (const top of [true, false]) {
      wallPath(top);
      const gr = ctx.createLinearGradient(0, top ? 0 : H, 0, H / 2);
      gr.addColorStop(0, `hsl(${hue + 30},40%,8%)`); gr.addColorStop(1, `hsl(${hue},60%,18%)`);
      ctx.fillStyle = gr; ctx.fill();
      ctx.beginPath();
      cave.forEach((c, i) => { const y = top ? c.mid - c.gap / 2 : c.mid + c.gap / 2; i ? ctx.lineTo(c.x, y) : ctx.moveTo(c.x, y); });
      ctx.shadowBlur = 18; ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.strokeStyle = `hsl(${hue},100%,65%)`; ctx.lineWidth = 3; ctx.stroke(); ctx.shadowBlur = 0;
    }
    for (const p of pillars) {
      const top = p.mid - p.gap / 2, bot = p.mid + p.gap / 2;
      const y0 = p.up ? bot - p.len : top - 40, y1 = p.up ? bot + 40 : top + p.len;
      ctx.fillStyle = `hsl(${hue + 180},70%,55%)`; ctx.shadowBlur = 20; ctx.shadowColor = `hsl(${hue + 180},100%,60%)`;
      ctx.beginPath();
      if (p.up) { ctx.moveTo(p.x - p.w / 2, y1); ctx.lineTo(p.x, y0); ctx.lineTo(p.x + p.w / 2, y1); }
      else { ctx.moveTo(p.x - p.w / 2, y0); ctx.lineTo(p.x, y1); ctx.lineTo(p.x + p.w / 2, y0); }
      ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  function drawTitleCave(t) {
    ctx.strokeStyle = `hsl(${hue},100%,65%)`; ctx.lineWidth = 3; ctx.shadowBlur = 18; ctx.shadowColor = ctx.strokeStyle;
    for (const top of [1, -1]) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 20) { const y = H / 2 - top * (210 + Math.sin(x * 0.01 + t * 0.8) * 30 + Math.sin(x * 0.023 - t) * 14); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  function drawPlayer(t) {
    const tr = player.trail;
    for (let i = 0; i < tr.length; i++) {
      const k = i / tr.length; ctx.globalAlpha = k * 0.6;
      ctx.fillStyle = `hsl(${hue + 20},100%,${60 + k * 20}%)`;
      ctx.beginPath(); ctx.arc(tr[i].x, tr[i].y, 3 + k * 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 34; ctx.shadowColor = '#fff6d0';
    ctx.fillStyle = '#fffbe8'; ctx.beginPath(); ctx.arc(player.x, player.y, 13, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    if (shield > 0) {
      ctx.strokeStyle = `rgba(160,255,255,${shield < 1.5 ? (Math.sin(t * 20) > 0 ? 0.9 : 0.2) : 0.85})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(player.x, player.y, 24 + Math.sin(t * 8) * 2, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function txt(s, x, y, size, col, weight, align) {
    ctx.font = `${weight || 800} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
    ctx.textAlign = align || 'center'; ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
  }
  function drawUI(t) {
    // mute
    ctx.globalAlpha = 0.7; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W - 60, 34); ctx.lineTo(W - 52, 34); ctx.lineTo(W - 42, 25); ctx.lineTo(W - 42, 55); ctx.lineTo(W - 52, 46); ctx.lineTo(W - 60, 46); ctx.closePath(); ctx.stroke();
    if (muted) { ctx.beginPath(); ctx.moveTo(W - 34, 32); ctx.lineTo(W - 22, 48); ctx.moveTo(W - 22, 32); ctx.lineTo(W - 34, 48); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(W - 38, 40, 10, -0.8, 0.8); ctx.stroke(); }
    ctx.globalAlpha = 1;

    if (state === 'title') {
      ctx.shadowBlur = 30; ctx.shadowColor = `hsl(${hue},100%,60%)`;
      txt('LUMEN DRIFT', W / 2, H / 2 - 30, 92, '#fff', 900);
      ctx.shadowBlur = 0;
      txt('Hold to rise · Release to fall', W / 2, H / 2 + 30, 26, '#cfe8ff', 500);
      txt('Collect sparks to chain combos · Gold sparks give a shield', W / 2, H / 2 + 66, 20, '#8fb3cc', 400);
      ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.4; txt('TAP OR PRESS SPACE TO PLAY', W / 2, H / 2 + 140, 28, '#fff', 800); ctx.globalAlpha = 1;
      if (best) txt('BEST ' + best, W / 2, H / 2 + 190, 22, '#ffe9a0', 700);
      return;
    }
    txt(String(score), 40, 64, 44, '#fff', 900, 'left');
    txt('BEST ' + Math.max(best, score), 42, 96, 18, '#8fb3cc', 700, 'left');
    if (combo > 1) txt('x' + Math.min(combo, 10) + ' COMBO', W / 2, 64, 30, `hsl(${hue},100%,75%)`, 900);
    if (state === 'paused') { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H); txt('PAUSED', W / 2, H / 2, 70, '#fff', 900); txt('Tap to continue', W / 2, H / 2 + 50, 24, '#cfe8ff', 500); }
    if (state === 'over' && overTimer > 0.35) {
      ctx.fillStyle = 'rgba(3,4,10,0.6)'; ctx.fillRect(0, 0, W, H);
      txt('GAME OVER', W / 2, H / 2 - 80, 80, '#fff', 900);
      txt(String(score), W / 2, H / 2 + 10, 64, '#ffe9a0', 900);
      txt(newBest ? 'NEW BEST!' : 'BEST ' + best, W / 2, H / 2 + 55, 26, newBest ? '#ffe9a0' : '#8fb3cc', 800);
      if (overTimer > 0.6) { ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.4; txt('TAP TO PLAY AGAIN', W / 2, H / 2 + 140, 28, '#fff', 800); ctx.globalAlpha = 1; }
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw(now / 1000);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
