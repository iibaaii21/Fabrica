<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lunavault</title>
<style>
  html,body{margin:0;height:100%;background:#070818;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';
  // Logical play column: 720 wide, height adapts to the screen (960..1500).
  const VW = 720;
  let VH = 1280;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let dpr = 1, sw = 0, sh = 0, scale = 1, offX = 0, offY = 0;
  const DEMO = /[?&]demo=1/.test(location.search);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    sw = window.innerWidth; sh = window.innerHeight;
    cv.width = Math.floor(sw * dpr); cv.height = Math.floor(sh * dpr);
    VH = Math.max(960, Math.min(1500, VW * sh / sw));
    scale = Math.min(sw / VW, sh / VH);
    offX = (sw - VW * scale) / 2; offY = (sh - VH * scale) / 2;
  }
  window.addEventListener('resize', resize); resize();

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('lunavault_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('lunavault_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let best = DEMO ? 0 : store.get('best', 0);
  let muted = DEMO ? true : store.get('muted', false);

  // ---------- audio ----------
  let ac = null;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    jump() { tone(300, 0.14, 'triangle', 0.08, 2.2); },
    land(c) { tone(520 * Math.pow(1.06, Math.min(c, 12)), 0.12, 'sine', 0.1); },
    perfect(c) { tone(660 * Math.pow(1.06, Math.min(c, 12)), 0.1, 'triangle', 0.09); setTimeout(() => tone(990 * Math.pow(1.06, Math.min(c, 12)), 0.14, 'triangle', 0.07), 70); },
    gem() { tone(1200, 0.08, 'square', 0.05); setTimeout(() => tone(1600, 0.1, 'square', 0.04), 60); },
    lose() { tone(260, 0.5, 'sawtooth', 0.1, 0.25); },
    start() { tone(440, 0.1, 'triangle', 0.07); setTimeout(() => tone(660, 0.14, 'triangle', 0.07), 90); }
  };

  // ---------- helpers ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const PALETTE = [
    ['#ffcf6b', '#e08a2c'], ['#7ee0ff', '#2f7fd6'], ['#c79bff', '#6a3fc4'], ['#8ff0a8', '#2c9a5c'],
    ['#ff9fb5', '#d24c78'], ['#ffe9a8', '#c9a23a'], ['#a9b8ff', '#4b5bd0']
  ];

  // background stars (screen-space parallax)
  const bgStars = [];
  for (let i = 0; i < 140; i++) bgStars.push({ x: Math.random(), y: Math.random(), z: rnd(0.2, 1), tw: rnd(0, 6.28) });

  // ---------- game state ----------
  let state = 'title';               // title | play | over | paused
  let planets = [], gems = [], parts = [];
  let player, camY, score, combo, gemsTaken, nextY, overT, flash, t = 0, demoT = 0, shake = 0;
  const SPEED = 640, FLY_MAX = 2.4;

  function makePlanet(x, y, r, spin, move) {
    const c = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    return { x, y, bx: x, r, spin, move, ph: rnd(0, 6.28), c, ring: Math.random() < 0.3, hit: 0, id: Math.random() };
  }

  function spawnUntil(topY) {
    while (nextY > topY - 200) {
      const lvl = score;
      const prev = planets[planets.length - 1];
      const gap = rnd(230, 300) + Math.min(lvl * 3, 60);
      const y = prev.y - gap;
      const r = clamp(rnd(34, 58) - Math.min(lvl * 0.4, 12), 28, 58);
      let x;
      for (let k = 0; k < 8; k++) { x = rnd(90 + r, VW - 90 - r); if (Math.abs(x - prev.x) > 90) break; }
      const sp = (rnd(1.5, 2.3) + Math.min(lvl * 0.03, 1.1)) * (Math.random() < 0.5 ? -1 : 1);
      const move = lvl > 12 && Math.random() < Math.min(0.15 + lvl * 0.01, 0.45) ? rnd(40, 90) : 0;
      const p = makePlanet(x, y, r, sp, move);
      planets.push(p);
      if (Math.random() < 0.45) {
        const t2 = rnd(0.35, 0.65);
        gems.push({ x: prev.x + (x - prev.x) * t2 + rnd(-40, 40), y: prev.y + (y - prev.y) * t2, taken: false, ph: rnd(0, 6) });
      }
      nextY = y;
    }
  }

  function reset() {
    planets = []; gems = []; parts = [];
    const p0 = makePlanet(VW / 2, 0, 56, 1.7, 0); p0.c = PALETTE[0];
    planets.push(p0);
    nextY = 0; score = 0; combo = 0; gemsTaken = 0; overT = 0; flash = 0; shake = 0;
    player = { on: p0, a: -Math.PI / 2, x: 0, y: 0, vx: 0, vy: 0, fly: 0, from: null, trail: [] };
    placeOnPlanet();
    camY = player.y - VH * 0.7;
    spawnUntil(camY - VH);
  }

  function orbitR(p) { return p.r + 20; }
  function placeOnPlanet() {
    const p = player.on;
    player.x = p.x + Math.cos(player.a) * orbitR(p);
    player.y = p.y + Math.sin(player.a) * orbitR(p);
  }

  function startGame() { reset(); state = 'play'; sfx.start(); }

  function jump() {
    if (state !== 'play' || !player.on) return;
    const d = { x: Math.cos(player.a), y: Math.sin(player.a) };
    player.vx = d.x * SPEED; player.vy = d.y * SPEED;
    player.from = player.on; player.on = null; player.fly = 0;
    sfx.jump();
    for (let i = 0; i < 8; i++) parts.push({ x: player.x, y: player.y, vx: -d.x * rnd(60, 160) + rnd(-60, 60), vy: -d.y * rnd(60, 160) + rnd(-60, 60), life: 0.4, c: '#ffffff' });
  }

  function land(q) {
    // perfect if the flight line passed close to the planet centre
    const sp = Math.hypot(player.vx, player.vy) || 1;
    const dx = player.vx / sp, dy = player.vy / sp;
    const wx = q.x - player.x, wy = q.y - player.y;
    const along = wx * dx + wy * dy;
    const perp = Math.abs(wx * dy - wy * dx);
    const perfect = perp < q.r * 0.38 && along > -q.r;
    player.on = q; player.a = Math.atan2(player.y - q.y, player.x - q.x); placeOnPlanet();
    q.hit = 1;
    if (perfect) { combo++; score += 1 + Math.min(combo, 5); sfx.perfect(combo); flash = 1; }
    else { combo = 0; score += 1; sfx.land(score); }
    for (let i = 0; i < (perfect ? 18 : 10); i++) {
      const a = rnd(0, 6.28), s = rnd(60, perfect ? 260 : 160);
      parts.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.6), c: perfect ? '#fff3a6' : q.c[0] });
    }
  }

  function lose() {
    state = 'over'; overT = 0; shake = 14; sfx.lose();
    if (score > best) { best = score; if (!DEMO) store.set('best', best); }
    for (let i = 0; i < 26; i++) {
      const a = rnd(0, 6.28), s = rnd(80, 300);
      parts.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, 0.9), c: i % 2 ? '#ffffff' : '#ff9fb5' });
    }
  }

  // ---------- autopilot (only with ?demo=1, used to record trailers) ----------
  function demoShouldJump() {
    if (!player.on) return false;
    const d = { x: Math.cos(player.a), y: Math.sin(player.a) };
    if (d.y > -0.15) return false;
    for (const q of planets) {
      if (q === player.on || q.y > player.on.y - 40) continue;
      const wx = q.x - player.x, wy = q.y - player.y;
      const along = wx * d.x + wy * d.y;
      if (along <= 0 || along > SPEED * FLY_MAX * 0.8) continue;
      const perp = Math.abs(wx * d.y - wy * d.x);
      if (perp < q.r * 0.22) return true;
    }
    return false;
  }

  // ---------- input ----------
  function toLogical(e) {
    const tt = e.touches && e.touches[0] ? e.touches[0] : e;
    if (!tt || tt.clientX === undefined) return null;
    return { x: (tt.clientX - offX) / scale, y: (tt.clientY - offY) / scale, sx: tt.clientX, sy: tt.clientY };
  }
  function hitMute(p) { return p && p.sx > sw - 70 && p.sy < 70; }
  function press(e) {
    if (e && e.cancelable) e.preventDefault();
    audio();
    const p = toLogical(e);
    if (hitMute(p) && state !== 'play') { muted = !muted; store.set('muted', muted); return; }
    if (state === 'title' || (state === 'over' && overT > 0.6)) startGame();
    else if (state === 'paused') state = 'play';
    else if (state === 'play') jump();
  }
  cv.addEventListener('mousedown', press);
  cv.addEventListener('touchstart', press, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(e); }
    if (e.code === 'KeyP' && state === 'play') state = 'paused';
    if (e.code === 'KeyM') { muted = !muted; store.set('muted', muted); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; });

  // ---------- update ----------
  function update(dt) {
    t += dt;
    for (const p of planets) {
      if (p.move) p.x = p.bx + Math.sin(t * 1.1 + p.ph) * p.move;
      p.hit = Math.max(0, p.hit - dt * 3);
    }
    for (const g of gems) g.ph += dt * 3;
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.97; q.vy *= 0.97; q.life -= dt;
      if (q.life <= 0) parts.splice(i, 1);
    }
    flash = Math.max(0, flash - dt * 2.5); shake = Math.max(0, shake - dt * 40);

    if (state === 'title') { if (DEMO && (demoT += dt) > 0.6) { demoT = 0; startGame(); } return; }
    if (state === 'over') { overT += dt; if (DEMO && overT > 1.4) startGame(); return; }
    if (state !== 'play') return;

    if (player.on) {
      player.a += player.on.spin * dt;
      placeOnPlanet();
      if (DEMO && demoShouldJump()) jump();
    } else {
      player.x += player.vx * dt; player.y += player.vy * dt; player.fly += dt;
      player.trail.push({ x: player.x, y: player.y }); if (player.trail.length > 14) player.trail.shift();
      for (const g of gems) {
        if (!g.taken && Math.hypot(g.x - player.x, g.y - player.y) < 30) { g.taken = true; gemsTaken++; score += 3; sfx.gem();
          for (let i = 0; i < 10; i++) { const a = rnd(0, 6.28); parts.push({ x: g.x, y: g.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: 0.4, c: '#7ef9ff' }); } }
      }
      for (const q of planets) {
        if (q === player.from) continue;
        if (Math.hypot(q.x - player.x, q.y - player.y) < q.r + 24) { land(q); break; }
      }
      const sy = player.y - camY;
      if (!player.on && (player.x < -30 || player.x > VW + 30 || sy > VH + 40 || sy < -80 || player.fly > FLY_MAX)) lose();
    }
    if (player.on) player.trail.length = 0;
    // camera: follow upward only
    const target = player.y - VH * 0.66;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 3.2);
    spawnUntil(camY - VH * 0.3);
    // planet below the screen while orbiting = lost (only if the screen moved on)
    if (player.on && player.on.y - camY > VH + player.on.r + 30) lose();
    // cleanup
    planets = planets.filter(p => p.y - camY < VH + 300 || p === player.on);
    gems = gems.filter(g => g.y - camY < VH + 100);
  }

  // ---------- render ----------
  function drawBackground() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, sh);
    const shiftH = clamp(-camY / 12000, 0, 1);
    g.addColorStop(0, `hsl(${245 - shiftH * 40},55%,${9 - shiftH * 3}%)`);
    g.addColorStop(1, `hsl(${265 - shiftH * 60},50%,${16 - shiftH * 6}%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);
    for (const s of bgStars) {
      const y = ((s.y * sh - camY * 0.05 * s.z * scale) % sh + sh) % sh;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + s.tw) * s.z;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(s.x * sw, y, 1.6 * s.z + 0.4, 1.6 * s.z + 0.4);
    }
    ctx.globalAlpha = 1;
  }

  function txt(s, x, y, size, color, weight, align) {
    ctx.font = `${weight || 800} ${size}px Inter, "Segoe UI", system-ui, sans-serif`;
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  function drawPlanet(p) {
    const y = p.y - camY;
    if (y < -p.r - 60 || y > VH + p.r + 60) return;
    // orbit guide
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([4, 10]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, y, orbitR(p), 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    // glow
    const gl = ctx.createRadialGradient(p.x, y, p.r * 0.6, p.x, y, p.r * 2.1);
    gl.addColorStop(0, p.c[0] + '55'); gl.addColorStop(1, p.c[0] + '00');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(p.x, y, p.r * 2.1, 0, 6.283); ctx.fill();
    // body
    const g = ctx.createRadialGradient(p.x - p.r * 0.35, y - p.r * 0.4, p.r * 0.1, p.x, y, p.r);
    g.addColorStop(0, p.c[0]); g.addColorStop(1, p.c[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, y, p.r * (1 + p.hit * 0.12), 0, 6.283); ctx.fill();
    // craters (rotate with spin)
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    for (let i = 0; i < 3; i++) {
      const a = t * p.spin * 0.5 + i * 2.1 + p.ph;
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * p.r * 0.45, y + Math.sin(a) * p.r * 0.45, p.r * (0.13 + i * 0.04), 0, 6.283); ctx.fill();
    }
    if (p.ring) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(p.x, y, p.r * 1.55, p.r * 0.38, -0.35, 0, 6.283); ctx.stroke();
    }
    if (p.move) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; txt('↔', p.x, y + p.r + 34, 20, 'rgba(255,255,255,0.45)', 700); }
  }

  function drawGem(g) {
    if (g.taken) return;
    const y = g.y - camY + Math.sin(g.ph) * 5;
    ctx.save(); ctx.translate(g.x, y); ctx.rotate(Math.PI / 4);
    ctx.shadowColor = '#7ef9ff'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#7ef9ff'; ctx.fillRect(-9, -9, 18, 18);
    ctx.fillStyle = '#e8feff'; ctx.fillRect(-9, -9, 8, 8);
    ctx.restore();
  }

  function drawPlayer() {
    const y = player.y - camY;
    // trail
    for (let i = 0; i < player.trail.length; i++) {
      const p = player.trail[i]; const k = i / player.trail.length;
      ctx.globalAlpha = k * 0.6; ctx.fillStyle = '#fff6c9';
      ctx.beginPath(); ctx.arc(p.x, p.y - camY, 4 + k * 8, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // aim line while orbiting
    if (player.on && state === 'play') {
      const dx = Math.cos(player.a), dy = Math.sin(player.a);
      ctx.strokeStyle = 'rgba(255,246,201,0.55)'; ctx.lineWidth = 3; ctx.setLineDash([2, 12]);
      ctx.beginPath(); ctx.moveTo(player.x + dx * 18, y + dy * 18); ctx.lineTo(player.x + dx * 120, y + dy * 120); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.shadowColor = '#fff3a6'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#fffdf0'; ctx.beginPath(); ctx.arc(player.x, y, 13, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(player.x - 3, y - 3, 5, 0, 6.283); ctx.fill();
  }

  function render() {
    drawBackground();
    const sx = shake ? rnd(-shake, shake) : 0, sy = shake ? rnd(-shake, shake) : 0;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx), dpr * (offY + sy));
    // soft column edges on wide screens
    if (state !== 'title') {
      for (const p of planets) drawPlanet(p);
      for (const g of gems) drawGem(g);
      for (const q of parts) { ctx.globalAlpha = clamp(q.life * 2, 0, 1); ctx.fillStyle = q.c; ctx.fillRect(q.x - 3, q.y - camY - 3, 6, 6); }
      ctx.globalAlpha = 1;
      if (state !== 'over') drawPlayer();
    }
    if (flash) { ctx.fillStyle = `rgba(255,243,166,${flash * 0.12})`; ctx.fillRect(0, 0, VW, VH); }

    // HUD
    if (state === 'play' || state === 'paused') {
      txt(String(score), VW / 2, 90, 84, '#ffffff', 900);
      if (combo > 1) txt('PERFECT ×' + combo, VW / 2, 150, 28, '#fff3a6', 800);
      txt('BEST ' + Math.max(best, score), VW / 2, 190 - (combo > 1 ? 0 : 36), 20, 'rgba(255,255,255,0.55)', 700);
    }
    if (state === 'title') {
      const cy = VH * 0.42;
      // decorative planets
      const deco = [[VW * 0.28, cy - 230, 44, PALETTE[1]], [VW * 0.72, cy - 330, 30, PALETTE[2]], [VW * 0.62, cy + 300, 58, PALETTE[0]]];
      for (const [x, y, r, c] of deco) {
        const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      }
      const a = t * 1.8, ox = VW * 0.62 + Math.cos(a) * 80, oy = cy + 300 + Math.sin(a) * 80;
      ctx.shadowColor = '#fff3a6'; ctx.shadowBlur = 20; ctx.fillStyle = '#fffdf0'; ctx.beginPath(); ctx.arc(ox, oy, 12, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      ctx.shadowColor = '#9c7bff'; ctx.shadowBlur = 30;
      txt('LUNAVAULT', VW / 2, cy, 104, '#ffffff', 900);
      ctx.shadowBlur = 0;
      txt('Tap to leap from moon to moon', VW / 2, cy + 74, 30, '#d9d2ff', 600);
      txt('Fly straight through the centre for PERFECT combos', VW / 2, cy + 116, 22, '#a99fe0', 500);
      ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.4; txt('TAP OR PRESS SPACE TO PLAY', VW / 2, cy + 196, 30, '#ffffff', 800); ctx.globalAlpha = 1;
      if (best) txt('BEST ' + best, VW / 2, cy + 246, 24, '#fff3a6', 700);
    }
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, VW, VH);
      txt('PAUSED', VW / 2, VH / 2, 80, '#fff', 900); txt('Tap to continue', VW / 2, VH / 2 + 60, 28, '#d9d2ff', 600);
    }
    if (state === 'over' && overT > 0.3) {
      ctx.fillStyle = 'rgba(7,8,24,0.55)'; ctx.fillRect(0, 0, VW, VH);
      const cy = VH * 0.42;
      txt('LOST IN SPACE', VW / 2, cy - 110, 56, '#ff9fb5', 900);
      txt(String(score), VW / 2, cy, 140, '#ffffff', 900);
      txt(score >= best && score > 0 ? 'NEW BEST!' : 'BEST ' + best, VW / 2, cy + 96, 30, '#fff3a6', 800);
      txt(gemsTaken + ' gems', VW / 2, cy + 140, 24, '#7ef9ff', 700);
      if (overT > 0.6) { ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.4; txt('TAP TO TRY AGAIN', VW / 2, cy + 230, 32, '#ffffff', 800); ctx.globalAlpha = 1; }
    }
    // mute icon (screen space, top-right)
    if (state !== 'play') {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '600 26px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(muted ? '🔇' : '🔊', sw - 36, 36);
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }
  reset(); state = 'title';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
